<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer 2026 Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fdfbf6;
    --ink: #1a1a1a;
    --muted: #6b6660;
    --line: #d9d3c7;
    --line-soft: #ebe6db;
    --accent: #c14a36;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    font-feature-settings: "ss01", "ss02";
  }
  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(193,74,54,0.04), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(31,107,138,0.05), transparent 40%);
    min-height: 100vh;
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 20px; border-bottom: 1px solid var(--line);
    margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
  }
  .title {
    font-weight: 300;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    letter-spacing: -0.02em; line-height: 1; margin: 0;
  }
  .title em { font-style: italic; color: var(--accent); font-weight: 400; }
  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--muted); margin-top: 8px;
  }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    max-width: 60%; justify-content: flex-end;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .btn {
    background: var(--paper); border: 1px solid var(--line); color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em;
    padding: 9px 16px; cursor: pointer; transition: all 0.15s ease; border-radius: 2px;
  }
  .btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); }
  .btn-danger:hover { background: var(--accent); border-color: var(--accent); color: white; }
  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem; color: var(--muted); letter-spacing: 0.05em;
  }

  .months { display: grid; grid-template-columns: repeat(2, 1fr); gap: 36px; }
  @media (max-width: 900px) { .months { grid-template-columns: 1fr; } }
  .month {
    background: var(--paper); border: 1px solid var(--line); padding: 22px;
    border-radius: 3px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 8px 24px -12px rgba(0,0,0,0.08);
  }
  .month-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft);
  }
  .month-name { font-size: 1.6rem; font-weight: 500; letter-spacing: -0.01em; }
  .month-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: var(--muted); letter-spacing: 0.18em;
  }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 6px; }
  .dow div {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--muted); text-align: center; padding: 4px 0;
  }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .day {
    min-height: 110px;
    background: #fbf8f1; border: 1px solid transparent;
    padding: 6px 7px 6px; cursor: pointer; position: relative;
    transition: background 0.12s ease, border-color 0.12s ease;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .day:hover { background: #fff; border-color: var(--line); }
  .day.empty { background: transparent; cursor: default; pointer-events: none; }
  .day-num { font-size: 0.9rem; font-weight: 500; color: var(--ink); line-height: 1; }
  .day.weekend .day-num { color: var(--muted); }
  .day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .day.today .day-num { color: var(--accent); font-weight: 700; }

  .events { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; flex: 1; }
  .event {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; line-height: 1.25;
    padding: 3px 5px; border-radius: 2px;
    letter-spacing: 0.02em;
    border-left: 2px solid;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .event-name {
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  .event-meta {
    display: block;
    font-size: 0.55rem;
    opacity: 0.75;
    margin-top: 1px;
    text-transform: none;
    letter-spacing: 0;
  }
  .event-more {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem; color: var(--muted); padding: 0 4px;
  }
  @media (max-width: 700px) {
    .day { min-height: 88px; padding: 4px 5px; }
    .event { font-size: 0.55rem; padding: 2px 4px; }
    .event-meta { font-size: 0.5rem; }
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,26,26,0.5);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper); border-radius: 4px;
    width: 100%; max-width: 520px; padding: 28px;
    box-shadow: 0 20px 60px -10px rgba(0,0,0,0.4);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { font-weight: 400; font-size: 1.4rem; margin: 0 0 4px 0; letter-spacing: -0.01em; }
  .modal h2 em { font-style: italic; color: var(--accent); }
  .modal-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 20px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%; background: white;
    border: 1px solid var(--line); padding: 9px 11px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 0.95rem; color: var(--ink);
    border-radius: 2px; transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .category-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .link-btn {
    background: transparent; color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
    cursor: pointer; padding: 9px 12px;
    border: 1px dashed var(--line); border-radius: 2px;
    transition: all 0.15s;
  }
  .link-btn:hover { border-color: var(--accent); background: rgba(193,74,54,0.05); }

  .existing-events { border-top: 1px solid var(--line-soft); margin-top: 18px; padding-top: 14px; }
  .existing-events h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin: 0 0 10px 0; font-weight: 500;
  }
  .existing-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; background: #fbf8f1;
    border-left: 3px solid var(--line);
    margin-bottom: 6px; border-radius: 2px; gap: 8px;
  }
  .existing-row .info { flex: 1; min-width: 0; }
  .existing-row .name { font-size: 0.92rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .existing-row .range { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .existing-row .actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    background: transparent; border: 1px solid var(--line);
    width: 28px; height: 28px; cursor: pointer; border-radius: 2px;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; transition: all 0.12s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .modal-actions {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-soft);
  }
  .modal-actions .right { display: flex; gap: 8px; }

  .edit-banner {
    background: #fef5e7; border-left: 3px solid var(--accent);
    padding: 8px 12px; margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em;
    border-radius: 2px; display: none;
  }
  .edit-banner.show { display: block; }

  .cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .cat-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: #fbf8f1;
    border-left: 3px solid; border-radius: 2px;
  }
  .cat-row .cat-name { flex: 1; font-size: 0.95rem; font-weight: 500; }
  .cat-row .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em;
  }
  .cat-empty { text-align: center; color: var(--muted); font-style: italic; padding: 20px; font-size: 0.9rem; }

  .color-picker-row { display: flex; align-items: center; gap: 10px; }
  .color-picker-row input[type="color"] { width: 50px; height: 38px; padding: 2px; cursor: pointer; }
  .color-presets { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 8px; }
  .color-preset {
    aspect-ratio: 1; border-radius: 3px;
    border: 2px solid transparent; cursor: pointer;
    transition: transform 0.1s;
  }
  .color-preset:hover { transform: scale(1.1); }
  .color-preset.selected { border-color: var(--ink); transform: scale(1.1); }

  .preview-event {
    margin-top: 8px; padding: 6px 10px;
    border-left: 3px solid;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
    border-radius: 2px;
  }

  @media print {
    body { background: white; padding: 0; }
    .toolbar, .modal-overlay { display: none !important; }
    .month { break-inside: avoid; box-shadow: none; }
    .months { gap: 24px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1 class="title">Summer <em>'26</em></h1>
      <div class="subtitle">May — August / Tournaments, Trips & Travel</div>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="toolbar">
    <div class="hint">Click any day to add or edit · Manage categories anytime · Saves to your browser</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="openCategoryManager()">Categories</button>
      <button class="btn" onclick="exportData()">Export</button>
      <button class="btn" onclick="importData()">Import</button>
      <button class="btn" onclick="window.print()">Print</button>
      <button class="btn btn-danger" onclick="resetData()">Reset</button>
    </div>
  </div>

  <div id="months" class="months"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add <em>event</em></h2>
    <div class="modal-date" id="modal-date"></div>
    <div class="edit-banner" id="edit-banner">Editing existing event</div>
    <div class="field">
      <label>Event name</label>
      <input type="text" id="ev-name" placeholder="e.g., Reef LAX Tournament">
    </div>
    <div class="row">
      <div class="field">
        <label>Start date</label>
        <input type="date" id="ev-start">
      </div>
      <div class="field">
        <label>End date</label>
        <input type="date" id="ev-end">
      </div>
    </div>
    <div class="field">
      <label>Category</label>
      <div class="category-row">
        <select id="ev-category"></select>
        <button class="link-btn" onclick="openCategoryEditor(null, true)">+ New</button>
      </div>
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="ev-notes" rows="2" placeholder="Location, details, etc."></textarea>
    </div>
    <div class="existing-events" id="existing-events"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <div class="right">
        <button class="btn btn-danger" id="delete-btn" onclick="deleteEvent()" style="display:none;">Delete</button>
        <button class="btn btn-primary" onclick="saveEvent()">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <h2>Manage <em>categories</em></h2>
    <div class="modal-date">Customize colors and add your own</div>
    <div class="cat-list" id="cat-list"></div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
      <button class="btn btn-primary" onclick="openCategoryEditor(null, false)">+ Add Category</button>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeCategoryManager()">Done</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cat-edit-modal">
  <div class="modal">
    <h2 id="cat-edit-title">New <em>category</em></h2>
    <div class="modal-date" id="cat-edit-sub">Pick a name and color</div>
    <div class="field">
      <label>Category name</label>
      <input type="text" id="cat-name" placeholder="e.g., Birthdays, Soccer, Work Trips">
    </div>
    <div class="field">
      <label>Color</label>
      <div class="color-picker-row">
        <input type="color" id="cat-color" value="#7a4a8a">
        <span class="hint" id="cat-color-hex">#7A4A8A</span>
      </div>
      <div class="color-presets" id="color-presets"></div>
    </div>
    <div class="field">
      <label>Preview</label>
      <div class="preview-event" id="cat-preview" style="background:#e8dcec; color:#7a4a8a; border-color:#7a4a8a;">
        Sample event
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeCategoryEditor()">Cancel</button>
      <div class="right">
        <button class="btn btn-danger" id="cat-delete-btn" onclick="deleteCategory()" style="display:none;">Delete</button>
        <button class="btn btn-primary" onclick="saveCategory()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'summer2026-calendar-v2';
  const MONTHS = [
    { name: 'May',    index: 4, year: 2026 },
    { name: 'June',   index: 5, year: 2026 },
    { name: 'July',   index: 6, year: 2026 },
    { name: 'August', index: 7, year: 2026 },
  ];
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const COLOR_PRESETS = [
    '#2d5f3f','#1f6b8a','#b8551c','#7a4a8a',
    '#c14a36','#d4a017','#5a7a8a','#8a5a4a',
    '#3a7a5a','#a83264','#4a6a8a','#6a8a3a',
    '#c46a4a','#5a4a8a','#8a3a3a','#3a3a3a'
  ];
  const DEFAULT_CATEGORIES = [
    { id: 'lax',    name: 'Reef LAX',         color: '#2d5f3f' },
    { id: 'boys',   name: 'Boys AZ Trip',     color: '#b8551c' },
    { id: 'maui',   name: 'Family Maui Trip', color: '#1f6b8a' },
    { id: 'custom', name: 'Custom',           color: '#7a4a8a' },
  ];
  const DEFAULT_EVENTS = [
    { id: 'lax-co',   name: 'Reef LAX — Colorado', start: '2026-06-12', end: '2026-06-18', category: 'lax',  notes: '' },
    { id: 'boys-az',  name: 'Boys AZ Trip',        start: '2026-07-08', end: '2026-07-18', category: 'boys', notes: '' },
    { id: 'lax-bend', name: 'Reef LAX — Bend',     start: '2026-07-25', end: '2026-07-26', category: 'lax',  notes: '' },
    { id: 'maui',     name: 'Family Maui Trip',    start: '2026-07-28', end: '2026-08-06', category: 'maui', notes: '' },
  ];

  let state = loadState();
  let editingId = null;
  let editingCatId = null;
  let returnToEventModal = false;
  let modalDate = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.events && data.categories) {
          return {
            categories: data.categories.length ? data.categories : [...DEFAULT_CATEGORIES],
            events: data.events
          };
        }
      }
    } catch (e) {}
    return { categories: [...DEFAULT_CATEGORIES], events: [...DEFAULT_EVENTS] };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.warn('Could not save:', e); }
  }

  function uid(prefix) { return (prefix || 'id') + '-' + Math.random().toString(36).slice(2, 10); }
  function getCategory(id) {
    return state.categories.find(c => c.id === id) || state.categories[0] || { id: 'fallback', name: '—', color: '#888' };
  }

  function lighten(hex, amount) {
    amount = amount === undefined ? 0.85 : amount;
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0,2), 16);
    const g = parseInt(h.slice(2,4), 16);
    const b = parseInt(h.slice(4,6), 16);
    const rL = Math.round(r + (255 - r) * amount);
    const gL = Math.round(g + (255 - g) * amount);
    const bL = Math.round(b + (255 - b) * amount);
    return 'rgb(' + rL + ', ' + gL + ', ' + bL + ')';
  }

  function fmtISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function parseISO(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function isInRange(iso, s, e) { return iso >= s && iso <= e; }
  function fmtPretty(iso) {
    return parseISO(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function fmtRange(s, e) {
    if (s === e) return fmtPretty(s);
    const sd = parseISO(s), ed = parseISO(e);
    const opts = { month: 'short', day: 'numeric' };
    if (sd.getFullYear() !== ed.getFullYear()) {
      return sd.toLocaleDateString('en-US', Object.assign({}, opts, {year:'numeric'})) + ' – ' + ed.toLocaleDateString('en-US', Object.assign({}, opts, {year:'numeric'}));
    }
    return sd.toLocaleDateString('en-US', opts) + ' – ' + ed.toLocaleDateString('en-US', opts) + ', ' + sd.getFullYear();
  }

  function daysBetween(a, b) {
    const ms = parseISO(b).getTime() - parseISO(a).getTime();
    return Math.round(ms / 86400000);
  }

  function buildEventMeta(ev, iso) {
    // Single-day event: show notes if present, otherwise nothing
    if (ev.start === ev.end) {
      return ev.notes ? ev.notes : '';
    }
    const totalDays = daysBetween(ev.start, ev.end) + 1;
    const dayNum = daysBetween(ev.start, iso) + 1;
    if (iso === ev.start) return 'Start · Day 1 of ' + totalDays;
    if (iso === ev.end)   return 'End · Day ' + totalDays + ' of ' + totalDays;
    return 'Day ' + dayNum + ' of ' + totalDays;
  }

  function render() {
    renderLegend();
    const root = document.getElementById('months');
    root.innerHTML = '';
    MONTHS.forEach(m => root.appendChild(buildMonth(m)));
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    state.categories.forEach(cat => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = cat.color;
      const lbl = document.createElement('span');
      lbl.textContent = cat.name;
      item.appendChild(sw);
      item.appendChild(lbl);
      el.appendChild(item);
    });
  }

  function buildMonth(m) {
    const wrap = document.createElement('div');
    wrap.className = 'month';

    const head = document.createElement('div');
    head.className = 'month-head';
    const nameEl = document.createElement('div');
    nameEl.className = 'month-name';
    nameEl.textContent = m.name;
    const yearEl = document.createElement('div');
    yearEl.className = 'month-year';
    yearEl.textContent = m.year;
    head.appendChild(nameEl);
    head.appendChild(yearEl);
    wrap.appendChild(head);

    const dow = document.createElement('div');
    dow.className = 'dow';
    DOW.forEach(d => {
      const el = document.createElement('div');
      el.textContent = d;
      dow.appendChild(el);
    });
    wrap.appendChild(dow);

    const grid = document.createElement('div');
    grid.className = 'grid';

    const first = new Date(m.year, m.index, 1);
    const startPad = first.getDay();
    const daysInMonth = new Date(m.year, m.index + 1, 0).getDate();
    const today = fmtISO(new Date());

    for (let i = 0; i < startPad; i++) {
      const d = document.createElement('div');
      d.className = 'day empty';
      grid.appendChild(d);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(m.year, m.index, day);
      const iso = fmtISO(date);
      const dayOfWeek = date.getDay();
      const cell = document.createElement('div');
      cell.className = 'day';
      if (dayOfWeek === 0 || dayOfWeek === 6) cell.classList.add('weekend');
      if (iso === today) cell.classList.add('today');
      cell.dataset.date = iso;
      cell.onclick = () => openModal(iso);

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = day;
      cell.appendChild(num);

      const evWrap = document.createElement('div');
      evWrap.className = 'events';

      const dayEvents = state.events.filter(ev => isInRange(iso, ev.start, ev.end));
      const visible = dayEvents.slice(0, 3);
      visible.forEach(ev => {
        const cat = getCategory(ev.category);
        const e = document.createElement('div');
        e.className = 'event';
        e.style.background = lighten(cat.color, 0.85);
        e.style.color = cat.color;
        e.style.borderLeftColor = cat.color;

        const nameEl = document.createElement('div');
        nameEl.className = 'event-name';
        nameEl.textContent = ev.name;
        e.appendChild(nameEl);

        const meta = buildEventMeta(ev, iso);
        if (meta) {
          const metaEl = document.createElement('span');
          metaEl.className = 'event-meta';
          metaEl.textContent = meta;
          e.appendChild(metaEl);
        }

        e.title = ev.name + '\n' + fmtRange(ev.start, ev.end) + (ev.notes ? '\n' + ev.notes : '');
        evWrap.appendChild(e);
      });
      if (dayEvents.length > 3) {
        const more = document.createElement('div');
        more.className = 'event-more';
        more.textContent = '+' + (dayEvents.length - 3) + ' more';
        evWrap.appendChild(more);
      }
      cell.appendChild(evWrap);
      grid.appendChild(cell);
    }

    wrap.appendChild(grid);
    return wrap;
  }

  function openModal(iso) {
    modalDate = iso;
    editingId = null;
    document.getElementById('modal-title').innerHTML = 'Add <em>event</em>';
    document.getElementById('modal-date').textContent = fmtPretty(iso);
    document.getElementById('ev-name').value = '';
    document.getElementById('ev-start').value = iso;
    document.getElementById('ev-end').value = iso;
    populateCategorySelect();
    const last = state.categories[state.categories.length - 1];
    document.getElementById('ev-category').value = last ? last.id : '';
    document.getElementById('ev-notes').value = '';
    document.getElementById('delete-btn').style.display = 'none';
    document.getElementById('edit-banner').classList.remove('show');
    renderExisting(iso);
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('ev-name').focus(), 50);
  }

  function populateCategorySelect(selectedId) {
    const sel = document.getElementById('ev-category');
    const current = selectedId || sel.value;
    sel.innerHTML = '';
    state.categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat.id;
      opt.textContent = cat.name;
      sel.appendChild(opt);
    });
    if (current && state.categories.find(c => c.id === current)) sel.value = current;
  }

  function renderExisting(iso) {
    const container = document.getElementById('existing-events');
    const dayEvents = state.events.filter(ev => isInRange(iso, ev.start, ev.end));
    if (dayEvents.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = '<h3>Events on this day</h3>';
    dayEvents.forEach(ev => {
      const cat = getCategory(ev.category);
      const row = document.createElement('div');
      row.className = 'existing-row';
      row.style.borderLeftColor = cat.color;
      const info = document.createElement('div');
      info.className = 'info';
      const nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = ev.name;
      const rg = document.createElement('div');
      rg.className = 'range';
      rg.textContent = fmtRange(ev.start, ev.end);
      info.appendChild(nm);
      info.appendChild(rg);
      const actions = document.createElement('div');
      actions.className = 'actions';
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.title = 'Edit';
      editBtn.textContent = '✎';
      editBtn.onclick = () => loadEventForEdit(ev);
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.title = 'Delete';
      delBtn.textContent = '×';
      delBtn.onclick = () => {
        if (confirm('Delete "' + ev.name + '"?')) {
          state.events = state.events.filter(x => x.id !== ev.id);
          saveState();
          render();
          renderExisting(iso);
        }
      };
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(info);
      row.appendChild(actions);
      container.appendChild(row);
    });
  }

  function loadEventForEdit(ev) {
    editingId = ev.id;
    document.getElementById('modal-title').innerHTML = 'Edit <em>event</em>';
    document.getElementById('ev-name').value = ev.name;
    document.getElementById('ev-start').value = ev.start;
    document.getElementById('ev-end').value = ev.end;
    populateCategorySelect(ev.category);
    document.getElementById('ev-notes').value = ev.notes || '';
    document.getElementById('delete-btn').style.display = 'inline-block';
    document.getElementById('edit-banner').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    editingId = null;
  }

  function saveEvent() {
    const name = document.getElementById('ev-name').value.trim();
    const start = document.getElementById('ev-start').value;
    const end = document.getElementById('ev-end').value;
    const category = document.getElementById('ev-category').value;
    const notes = document.getElementById('ev-notes').value.trim();
    if (!name) { alert('Please enter an event name.'); return; }
    if (!start || !end) { alert('Please choose a start and end date.'); return; }
    if (end < start) { alert('End date must be on or after start date.'); return; }
    if (!category) { alert('Please pick a category.'); return; }
    if (editingId) {
      const ev = state.events.find(e => e.id === editingId);
      if (ev) Object.assign(ev, { name, start, end, category, notes });
    } else {
      state.events.push({ id: uid('ev'), name, start, end, category, notes });
    }
    saveState();
    render();
    closeModal();
  }

  function deleteEvent() {
    if (!editingId) return;
    const ev = state.events.find(e => e.id === editingId);
    if (ev && confirm('Delete "' + ev.name + '"?')) {
      state.events = state.events.filter(e => e.id !== editingId);
      saveState();
      render();
      closeModal();
    }
  }

  function openCategoryManager() {
    renderCategoryList();
    document.getElementById('cat-modal').classList.add('open');
  }
  function closeCategoryManager() {
    document.getElementById('cat-modal').classList.remove('open');
  }
  function renderCategoryList() {
    const list = document.getElementById('cat-list');
    list.innerHTML = '';
    if (state.categories.length === 0) {
      list.innerHTML = '<div class="cat-empty">No categories yet — add one below.</div>';
      return;
    }
    state.categories.forEach(cat => {
      const count = state.events.filter(e => e.category === cat.id).length;
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.style.borderLeftColor = cat.color;
      row.style.background = lighten(cat.color, 0.92);

      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = cat.color;
      sw.style.width = '14px';
      sw.style.height = '14px';

      const nm = document.createElement('div');
      nm.className = 'cat-name';
      nm.textContent = cat.name;

      const cn = document.createElement('span');
      cn.className = 'count';
      cn.textContent = count + ' event' + (count === 1 ? '' : 's');

      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.title = 'Edit';
      editBtn.textContent = '✎';
      editBtn.onclick = () => openCategoryEditor(cat.id, false);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.title = 'Delete';
      delBtn.textContent = '×';
      delBtn.onclick = () => attemptDeleteCategory(cat.id);

      row.appendChild(sw);
      row.appendChild(nm);
      row.appendChild(cn);
      row.appendChild(editBtn);
      row.appendChild(delBtn);
      list.appendChild(row);
    });
  }

  function attemptDeleteCategory(catId) {
    const cat = state.categories.find(c => c.id === catId);
    if (!cat) return;
    const usedBy = state.events.filter(e => e.category === catId);
    if (usedBy.length > 0) {
      const others = state.categories.filter(c => c.id !== catId);
      if (others.length === 0) {
        alert('Cannot delete "' + cat.name + '" — it\'s the only category and ' + usedBy.length + ' event(s) use it. Add another category first.');
        return;
      }
      const target = others[0];
      if (!confirm('"' + cat.name + '" is used by ' + usedBy.length + ' event(s). Reassign them to "' + target.name + '" and delete?')) return;
      state.events.forEach(e => { if (e.category === catId) e.category = target.id; });
    } else {
      if (!confirm('Delete category "' + cat.name + '"?')) return;
    }
    state.categories = state.categories.filter(c => c.id !== catId);
    saveState();
    render();
    renderCategoryList();
  }

  function openCategoryEditor(catId, returnToEvent) {
    editingCatId = catId;
    returnToEventModal = !!returnToEvent;
    const cat = catId ? state.categories.find(c => c.id === catId) : null;
    document.getElementById('cat-edit-title').innerHTML = cat ? 'Edit <em>category</em>' : 'New <em>category</em>';
    document.getElementById('cat-edit-sub').textContent = cat ? 'Editing "' + cat.name + '"' : 'Pick a name and color';
    document.getElementById('cat-name').value = cat ? cat.name : '';
    const initialColor = cat ? cat.color : COLOR_PRESETS[Math.floor(Math.random() * COLOR_PRESETS.length)];
    document.getElementById('cat-color').value = initialColor;
    document.getElementById('cat-color-hex').textContent = initialColor.toUpperCase();
    document.getElementById('cat-delete-btn').style.display = cat ? 'inline-block' : 'none';
    renderColorPresets(initialColor);
    updatePreview(initialColor);
    document.getElementById('cat-edit-modal').classList.add('open');
    setTimeout(() => document.getElementById('cat-name').focus(), 50);
  }

  function renderColorPresets(selected) {
    const wrap = document.getElementById('color-presets');
    wrap.innerHTML = '';
    COLOR_PRESETS.forEach(color => {
      const btn = document.createElement('div');
      btn.className = 'color-preset' + (color.toLowerCase() === selected.toLowerCase() ? ' selected' : '');
      btn.style.background = color;
      btn.title = color;
      btn.onclick = () => {
        document.getElementById('cat-color').value = color;
        document.getElementById('cat-color-hex').textContent = color.toUpperCase();
        renderColorPresets(color);
        updatePreview(color);
      };
      wrap.appendChild(btn);
    });
  }

  document.getElementById('cat-color').addEventListener('input', e => {
    const color = e.target.value;
    document.getElementById('cat-color-hex').textContent = color.toUpperCase();
    renderColorPresets(color);
    updatePreview(color);
  });

  function updatePreview(color) {
    const name = document.getElementById('cat-name').value.trim() || 'Sample event';
    const prev = document.getElementById('cat-preview');
    prev.style.background = lighten(color, 0.85);
    prev.style.color = color;
    prev.style.borderColor = color;
    prev.textContent = name;
  }
  document.getElementById('cat-name').addEventListener('input', () => {
    updatePreview(document.getElementById('cat-color').value);
  });

  function closeCategoryEditor() {
    document.getElementById('cat-edit-modal').classList.remove('open');
    editingCatId = null;
    returnToEventModal = false;
  }

  function saveCategory() {
    const name = document.getElementById('cat-name').value.trim();
    const color = document.getElementById('cat-color').value;
    if (!name) { alert('Please enter a category name.'); return; }
    let savedId;
    if (editingCatId) {
      const cat = state.categories.find(c => c.id === editingCatId);
      if (cat) { cat.name = name; cat.color = color; savedId = cat.id; }
    } else {
      const newCat = { id: uid('cat'), name: name, color: color };
      state.categories.push(newCat);
      savedId = newCat.id;
    }
    saveState();
    render();
    renderCategoryList();
    if (returnToEventModal) populateCategorySelect(savedId);
    closeCategoryEditor();
  }

  function deleteCategory() {
    if (!editingCatId) return;
    const idToDelete = editingCatId;
    closeCategoryEditor();
    attemptDeleteCategory(idToDelete);
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'summer-2026-calendar.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json';
    inp.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if (Array.isArray(data)) {
            state.events = data.map(d => ({
              id: d.id || uid('ev'),
              name: String(d.name || 'Untitled'),
              start: d.start, end: d.end || d.start,
              category: d.category || (state.categories[0] && state.categories[0].id),
              notes: d.notes || ''
            }));
          } else if (data.events && data.categories) {
            state = data;
          } else {
            throw new Error('Unrecognized format');
          }
          saveState();
          render();
          alert('Imported ' + state.events.length + ' events and ' + state.categories.length + ' categories.');
        } catch (err) {
          alert('Could not import: ' + err.message);
        }
      };
      reader.readAsText(file);
    };
    inp.click();
  }

  function resetData() {
    if (confirm('Reset everything to defaults? Your custom events and categories will be lost.')) {
      state = { categories: [...DEFAULT_CATEGORIES], events: [...DEFAULT_EVENTS] };
      saveState();
      render();
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('cat-edit-modal').classList.contains('open')) closeCategoryEditor();
      else if (document.getElementById('cat-modal').classList.contains('open')) closeCategoryManager();
      else closeModal();
    }
  });

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) {
        if (overlay.id === 'cat-edit-modal') closeCategoryEditor();
        else if (overlay.id === 'cat-modal') closeCategoryManager();
        else closeModal();
      }
    });
  });

  render();
</script>

</body>
</html>
